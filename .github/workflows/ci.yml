name: Runtime with explicit development revision
on:
  workflow_dispatch:
    inputs:
      development_commit:
        description: Full SHA of audited public development tools (activate after repository publication)
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate explicit development revision
        shell: bash
        env:
          DEVELOPMENT_COMMIT: ${{ inputs.development_commit }}
        run: python -c "import os,re; assert re.fullmatch('[0-9a-f]{40}',os.environ['DEVELOPMENT_COMMIT']), 'A full development SHA is required'"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sebinsebon/paes-importer-dev
          ref: ${{ inputs.development_commit }}
          path: development
          persist-credentials: false
      - name: Install minimum dependencies outside runtime
        shell: bash
        run: python -B development/scripts/setup_dev.py --runtime runtime
      - name: Verify selected pair of sources
        shell: bash
        run: |
          if [ -x development/.venv/bin/python ]; then
            development/.venv/bin/python -B development/scripts/check.py --runtime runtime --report development/results/ci.json
          else
            development/.venv/Scripts/python.exe -B development/scripts/check.py --runtime runtime --report development/results/ci.json
          fi
